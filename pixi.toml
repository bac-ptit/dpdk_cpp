[workspace]
authors = ["bac <bacdaiphu@gmail.com>"]
channels = ["conda-forge"]
name = "FastAPI"
platforms = ["linux-64"]
version = "0.1.0"
preview = ["pixi-build"]

[dependencies]
clang = ">=22"
cmake = ">=4.0"
pyyaml = ">=6.0.3,<7"
clangxx = ">=22.1.7,<23"
llvm-tools = ">=22.1.7,<23"
lld = ">=22.1.7,<23"
ninja = ">=1.13.2,<2"
llvm = ">=22.1.7,<23"
libpcap = ">=1.10.6,<2"
compiler-rt = ">=22.1.7,<23"
vectorscan = ">=5.4.11,<6"

[activation.env]
PKG_CONFIG_PATH = "$PIXI_PROJECT_ROOT/.pixi/envs/default/lib/pkgconfig:/usr/lib64/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig"
# Force clang to use ld.lld for every link. Without this, the IPO/LTO
# test in CMakeLists.txt invokes x86_64-conda-linux-gnu-ld which then
# looks for LLVMgold.so — a plugin that doesn't exist for LLVM 22 in
# this environment. ld.lld has LTO built in, no plugin needed.
LDFLAGS = "-fuse-ld=lld"

[tasks]
cmake = "cmake --preset pixi"
cmake-release = "cmake --preset pixi-release"
build = "cmake --build --preset pixi-debug"
build-release = "cmake --preset pixi-release && cmake --build --preset pixi-release"
clean = "rm -rf cmake-build-debug cmake-build-release build_debug build"
install = "./script/install.sh"
# test_env.sh has only three jobs: (1) generate pcap shards for the
# requested count, (2) copy $PROJECT_DIR/config.yaml next to the binary,
# (3) run the binary with a timeout. Every other setting (memory_size,
# cpu_core_list, queues, SPI/DPI rules, l3_forward, ...) is read from
# config.yaml and never touched by the bench script.
#
# worker_count, pcap shard directory, and any other bench-relevant knobs
# are read out of config.yaml — no per-task override here. Set
# dpi.enabled: false in config.yaml for SPI-only behaviour.
docs = "doxygen Doxyfile"
benchmark = "./script/benchmark.sh 1000000 15 100"
test = "python3 test/test_spi_rules.py"
# Verify SPI rules match lv3.csv — generate traffic, run app, check stats.
test-spi = "python3 test/test_spi_rules.py"
verify-rules-release = "python3 test/verify_rules.py --build-dir cmake-build-release"
# Hot-reload FastAPI config from disk without restarting workers. test_env.sh
# copies the source config.yaml into $BUILD_DIR; FastAPI's compile-time
# CONFIG_PATH resolves to that copy, so SIGUSR1 reloads from disk.
reload = "./script/reload.sh"
# ──────────────────────────────────────────────────────────────────────
# Benchmark tasks. Two subcommands live in test/test_env.sh.
# ──────────────────────────────────────────────────────────────────────
# gen_test_pcap.py — 5-tuple only (TCP SYN, UDP, DNS), NO payload. Used
# to measure pure SPI throughput: without L7 there's nothing for
# ExtractHostname / MatchDpi to chew on, so the DPI path is bypassed
# regardless of DPI rules in config.yaml. Use this to isolate SPI cost.
bench-spi = "BUILD_DIR=cmake-build-release ./test/test_env.sh bench-spi 1000000"
# gen_dpi_bench_pcap.py — TCP SYN + TLS ClientHello with SNIs matching the
# production DPI filter groups. End-to-end benchmark using whatever
# rules config.yaml declares (SPI + DPI when DPI is enabled).
bench = "BUILD_DIR=cmake-build-release ./test/test_env.sh bench 1000000"
gen-rules = "python3 script/gen_rules.py --groups 100 --rules 50 --out rules.beve"
gen-rules-large = "python3 script/gen_rules.py --groups 4096 --rules 2048 --out rules_8m.beve"
gen-pcap-frag = "python3 script/gen_test_fragments_pcap.py --count 100 --out test/bench_fragments.pcap"
