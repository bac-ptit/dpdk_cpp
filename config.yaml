app:
  burst_size: 128
  mac_updating: false
  timer_period_sec: 5
dpi:
  enabled: true
  # DPI rule groups referenced by SPI's `dpi_filter_group` link.
  # Priorities ASC — highest-priority rule wins per hostname.
  # fg_l7_*_filter groups are linked from SPI; fg_l7_catchall covers
  # anything not pre-classified by SPI.
  filters:
  - filter_group: fg_l7_facebook
    hostname_pattern: '*.facebook.com'
    label: facebook
    priority: 10
  - filter_group: fg_l7_youtube
    hostname_pattern: '*.youtube.com'
    label: youtube
    priority: 20
  - filter_group: fg_l7_google
    hostname_pattern: '*.google.com'
    label: google
    priority: 30
  - filter_group: fg_l7_catchall
    hostname_pattern: '*'
    label: catchall
    priority: 999
eal:
  cpu_core_list: 0-4
  disable_hugepages: false
  disable_pci: true
  file_prefix: spifast
  legacy_memory: true
  log_level: '7'
  memory_channels: 2
  memory_size: '3418'
  process_type: primary
  virtual_devices:
  - net_pcap0,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/bench_pcap_shards/bench_q0.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/bench_pcap_shards/bench_q1.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/bench_pcap_shards/bench_q2.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/bench_pcap_shards/bench_q3.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/bench_pcap_shards/bench_q4.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/bench_pcap_shards/bench_q5.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/bench_pcap_shards/bench_q6.pcap,infinite_rx=1
l3_forward:
  enabled: false
  ethernet_destinations:
  - mac_address: 52:54:00:5a:2c:95
    port_id: 0
  - mac_address: 52:54:00:fe:7b:5d
