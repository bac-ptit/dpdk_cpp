# ==============================================================================
# FASTSPI / DPDK MAXIMUM PERFORMANCE TUNED CONFIGURATION (15 WORKERS, INFINITE RX)
# ==============================================================================

eal:
  cpu_core_list: 0-15               # 1 main lcore (0) + 15 worker lcores (1-15)
  file_prefix: spifast_bench
  legacy_memory: false
  log_level: '8'
  memory_channels: 2
  memory_size: '2048'
  disable_hugepages: false           # Enabled Hugepages for hardware TLB zero-copy acceleration
  disable_pci: true
  virtual_devices:
  - net_pcap0,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/beve_shards/shard_0.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/beve_shards/shard_1.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/beve_shards/shard_2.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/beve_shards/shard_3.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/beve_shards/shard_4.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/beve_shards/shard_5.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/beve_shards/shard_6.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/beve_shards/shard_7.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/beve_shards/shard_8.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/beve_shards/shard_9.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/beve_shards/shard_10.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/beve_shards/shard_11.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/beve_shards/shard_12.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/beve_shards/shard_13.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/beve_shards/shard_14.pcap,tx_pcap=/dev/null,tx_pcap=/dev/null,tx_pcap=/dev/null,tx_pcap=/dev/null,tx_pcap=/dev/null,tx_pcap=/dev/null,tx_pcap=/dev/null,tx_pcap=/dev/null,tx_pcap=/dev/null,tx_pcap=/dev/null,tx_pcap=/dev/null,tx_pcap=/dev/null,tx_pcap=/dev/null,tx_pcap=/dev/null,tx_pcap=/dev/null,infinite_rx=1

app:
  burst_size: 64                    # Optimal burst size (64) for maximum L1/L2 cache & Mpps throughput
  mac_updating: false
  timer_period_sec: 1

mempool:
  cache_size: 512                   # Maximized per-core mempool cache (DPDK limit 512)
  memory_buffer_count: 131071       # Doubled mbuf pool size (2^17 - 1 optimum)
  memory_buffer_size: 2176
  name: mbuf_pool_test

port:
  link_check_interval_ms: 100
  link_check_max_count: 90
  link_speed: 0
  port_bitmask: '0x1'
  promiscuous: true
  receive_descriptors: 2048         # Maximized RX ring size (2048 descriptors)
  receive_queues: 15
  transmit_descriptors: 2048        # Maximized TX ring size (2048 descriptors)
  transmit_queues: 15

l3_forward:
  enabled: false
  lookup_method: lpm

pcap_injector:
  enabled: false

spi:
  worker_count: 15
  packet_distribution: queue
  dispatch_queue_size: 65536        # Doubled dispatch ring size
  drop_unmatched: false
  flow_ttl_sec: 300
  max_concurrent_flows: 100000
  flow_overflow_action: drop
  rule_path: rules.beve
