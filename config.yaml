mempool:
  cache_size: 256
  memory_buffer_count: 1000250
  memory_buffer_size: 2176
  name: mbuf_pool
pcap_injector:
  enabled: false
port:
  link_check_interval_ms: 100
  link_check_max_count: 90
  link_speed: 0
  port_bitmask: '0x1'
  promiscuous: true
  receive_descriptors: 1024
  receive_queues: 7
  transmit_descriptors: 1024
  transmit_queues: 7
spi:
  dispatch_queue_size: 8192
  drop_unmatched: true
  filter_groups:
  # ────────────────────────────────────────────────────────────────────
  # DPI-OPT-IN GROUPS — IP ranges that unambiguously identify an app.
  # `l7_required: true` keeps DPI alive for them, AND
  # `dpi_filter_group` STATICALLY LINKS the SPI match to the matching DPI
  # group — so when SPI matches, the per-packet ExtractHostname + MatchDpi
  # cost is skipped entirely (O(1) cached forward). Empty packets on these
  # IPs flow straight to the flow cache. See docs_search/15_spi_to_dpi_link.md.
  # ────────────────────────────────────────────────────────────────────
  - action: forward
    dpi_filter_group: fg_l7_facebook
    filters:
    - destination_ip_address: 31.13.64.0/18
      label: facebook_1
      protocol: tcp
    - destination_ip_address: 66.220.144.0/20
      label: facebook_2
      protocol: tcp
    - destination_ip_address: 69.63.176.0/20
      label: facebook_3
      protocol: tcp
    - destination_ip_address: 157.240.0.0/16
      label: facebook_4
      protocol: tcp
    - destination_ip_address: 69.220.144.5
      label: facebook_5
      protocol: tcp
    l7_required: true
    name: fg_l34_facebook
    precedence: 100
  - action: forward
    dpi_filter_group: fg_l7_youtube
    filters:
    - destination_ip_address: 142.250.0.0/15
      destination_port: 443
      label: youtube_1
      protocol: tcp
    - destination_ip_address: 172.217.0.0/16
      destination_port: 443
      label: youtube_2
      protocol: tcp
    - destination_ip_address: 216.58.192.0/19
      destination_port: 443
      label: youtube_3
      protocol: tcp
    - destination_ip_address: 74.125.0.1
      destination_port: 443
      label: youtube_4
      protocol: tcp
    l7_required: true
    name: fg_l34_youtube
    precedence: 101
  # ────────────────────────────────────────────────────────────────────
  # COARSE L3/L4 GROUPS — match broad traffic but DO NOT touch L7.
  # l7_required defaults to false so even when DPI is enabled, these
  # groups short-circuit DPI on every packet → zero per-packet DPI cost.
  # ────────────────────────────────────────────────────────────────────
  - action: forward
    filters:
    - destination_port: 53
      label: dns_udp
      protocol: udp
    - destination_port: 53
      label: dns_tcp
      protocol: tcp
    name: fg_l34_dns
    precedence: 104
  - action: drop
    filters:
    - destination_port: 9999
      label: udp_drop
      protocol: udp
    name: fg_l34_udp_sdf1006
    precedence: 106
  flow_overflow_action: drop
  flow_ttl_sec: 300
  max_concurrent_flows: 1000000
  packet_distribution: auto
  worker_count: 4
