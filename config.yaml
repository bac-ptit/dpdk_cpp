# ==============================================================================
# FASTSPI / DPDK PRODUCTION BENCHMARK CONFIGURATION (15 WORKERS, INFINITE RX, 6GB RAM)
# ==============================================================================

eal:
  cpu_core_list: 0-15               # 1 main lcore (0) + 15 worker lcores (1-15)
  file_prefix: spifast_bench
  legacy_memory: false
  log_level: '8'
  memory_channels: 2
  memory_size: '3800'               # 3.8GB hugepages allocated to EAL (from 4GB OS pool)
  disable_hugepages: false           # Hugepages enabled for hardware TLB zero-copy acceleration
  disable_pci: true
  virtual_devices:
  - net_pcap0,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/bench_pcap_shards/bench_q0.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/bench_pcap_shards/bench_q1.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/bench_pcap_shards/bench_q2.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/bench_pcap_shards/bench_q3.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/bench_pcap_shards/bench_q4.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/bench_pcap_shards/bench_q5.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/bench_pcap_shards/bench_q6.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/bench_pcap_shards/bench_q7.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/bench_pcap_shards/bench_q8.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/bench_pcap_shards/bench_q9.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/bench_pcap_shards/bench_q10.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/bench_pcap_shards/bench_q11.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/bench_pcap_shards/bench_q12.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/bench_pcap_shards/bench_q13.pcap,rx_pcap=/home/bac/programming/viettel/dpdk_cpp/test/bench_pcap_shards/bench_q14.pcap,tx_pcap=/dev/null,tx_pcap=/dev/null,tx_pcap=/dev/null,tx_pcap=/dev/null,tx_pcap=/dev/null,tx_pcap=/dev/null,tx_pcap=/dev/null,tx_pcap=/dev/null,tx_pcap=/dev/null,tx_pcap=/dev/null,tx_pcap=/dev/null,tx_pcap=/dev/null,tx_pcap=/dev/null,tx_pcap=/dev/null,tx_pcap=/dev/null,infinite_rx=1

app:
  burst_size: 64                    # Maximized burst size (64) for peak Mpps throughput
  mac_updating: false
  timer_period_sec: 1

dpi:
  enabled: false
  filters:
  - filter_group: fg_l7_facebook
    hostname_pattern: '*.facebook.com'
    label: facebook
    priority: 10
  - filter_group: fg_l7_youtube
    hostname_pattern: '*.youtube.com'
    label: youtube
    priority: 20
  - filter_group: fg_l7_google
    hostname_pattern: '*.google.com'
    label: google
    priority: 30
  - filter_group: fg_l7_catchall
    hostname_pattern: '*'
    label: catchall
    priority: 999

mempool:
  cache_size: 512                   # Maximized per-core mempool cache
  memory_buffer_count: 1441791       # ~1.44M mbufs (~3.13 GB total mbuf memory)
  memory_buffer_size: 2176
  name: mbuf_pool_test

port:
  link_check_interval_ms: 100
  link_check_max_count: 90
  link_speed: 0
  port_bitmask: '0x1'
  promiscuous: true
  receive_descriptors: 2048         # Maximized RX ring size
  receive_queues: 15
  transmit_descriptors: 2048        # Maximized TX ring size
  transmit_queues: 15

l3_forward:
  enabled: false
  lookup_method: lpm

pcap_injector:
  enabled: false

spi:
  worker_count: 15
  packet_distribution: queue
  dispatch_queue_size: 65536
  drop_unmatched: true
  flow_ttl_sec: 300
  fragment_timeout_sec: 60          # Drop incomplete IPv4/IPv6 fragment sets after 60 seconds
  tcp_reassembly:
    enabled: false                  # Enable when DPI must inspect split TCP payloads
    idle_timeout_sec: 60
    max_concurrent_streams: 16384
    max_buffered_bytes_per_direction: 16384
    max_out_of_order_segments: 32
    memory_budget_mb: 256
    drop_conflicting_overlap: true
  max_concurrent_flows: 30000
  flow_overflow_action: reclassify
  max_compilation_threads: 6
  max_acl_build_threads: 2
  acl_classify_algorithm: avx2       # Explicit SIMD classifier; use default to auto-select
  acl_build_max_size_mb: 0           # 0 = DPDK default; constrain only after measuring trie memory
  rule_path: rules.beve

